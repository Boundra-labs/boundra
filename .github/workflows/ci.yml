name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: boundra
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: boundra_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U boundra -d boundra_test"
          --health-interval=5s --health-timeout=3s --health-retries=15
    env:
      DATABASE_URL: postgresql://boundra:ci-only-not-a-production-secret@localhost:55432/boundra_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
      # The browser suites run this job's web build against the local E2E chain. This build is
      # never deployed: images are built separately (compose job, release workflow).
      NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable pinned package manager
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:setup
      - run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm test:e2e:chain
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:real
      - name: Keep browser traces and service logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            tmp/e2e-real/logs/
          retention-days: 7

  # The deployable stack as operators run it: images built from the Dockerfile, migrations,
  # backup, worker, API, web and Caddy HTTPS (APP_DOMAIN=localhost, Caddy's local CA).
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Deployment settings
        run: |
          node scripts/setup.mjs --deploy
          sed -i "s/^RELEASE=.*/RELEASE=$RELEASE/" deploy/.env
      - name: Build and start the stack
        run: docker compose --env-file deploy/.env --profile app --profile public up --build -d
      - name: Reports its release over HTTPS
        run: |
          compose="docker compose --env-file deploy/.env --profile app --profile public"
          for i in $(seq 1 60); do
            $compose exec -T proxy cat /data/caddy/pki/authorities/local/root.crt > caddy-root.crt 2>/dev/null \
              && curl -fsS --cacert caddy-root.crt https://localhost/status -o status.json && break
            sleep 5
          done
          cat status.json
          node -e "
            const s = require('./status.json');
            const ok = s.status === 'ok' && s.release.web === process.env.RELEASE && s.release.api === process.env.RELEASE;
            if (!ok) { console.error('unexpected /status'); process.exit(1); }"
          curl -fsS --cacert caddy-root.crt https://localhost/api/v1/health/live
      - name: Service logs
        if: failure()
        run: docker compose --env-file deploy/.env --profile app --profile public logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose --env-file deploy/.env --profile app --profile public down --volumes
