name: boundra

# Shared by the API and worker. Point DEPLOYMENT_MANIFEST_PATH at a reviewed manifest in
# deploy/manifests (mounted at /config/manifests); unset, the worker stays observe-only.
x-database-url: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public

x-chain: &chain
  CHAIN_ID: 84532
  BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
  DEPLOYMENT_MANIFEST_PATH: ${DEPLOYMENT_MANIFEST_PATH:-}
  CHAIN_CONFIRMATIONS: ${CHAIN_CONFIRMATIONS:-5}
  WORKER_HEARTBEAT_MAX_AGE_MS: ${WORKER_HEARTBEAT_MAX_AGE_MS:-45000}

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm env:setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:setup first}
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm env:setup first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Scheduled pg_dump backups into BACKUP_DIR (./backups by default; copy them off this host).
  # One-off: pnpm db:backup. Restore drill: pnpm db:restore-drill.
  backup:
    profiles: [app]
    image: postgres:17.9-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Run pnpm env:setup first}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:setup first}
      PGDATABASE: ${POSTGRES_DB:?Run pnpm env:setup first}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/boundra-backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ['/bin/sh', '/usr/local/bin/boundra-backup.sh']
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    profiles: [app]
    image: ${IMAGE_PREFIX:-boundra}-migrate:${RELEASE:-dev}
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: [app]
    image: ${IMAGE_PREFIX:-boundra}-worker:${RELEASE:-dev}
    build:
      context: .
      target: worker
      args:
        RELEASE: ${RELEASE:-dev}
    environment:
      <<: *chain
      NODE_ENV: production
      DATABASE_URL: *database-url
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-10000}
      RECEIPT_REORG_WINDOW_BLOCKS: ${RECEIPT_REORG_WINDOW_BLOCKS:-20}
      MONITOR_BATCH_BLOCKS: ${MONITOR_BATCH_BLOCKS:-180}
      # Signing stays off unless every one of these is set (see docs/runbook.md, worker modes).
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:-}
      ATTEMPT_ENCRYPTION_KEY: ${ATTEMPT_ENCRYPTION_KEY:-}
      MAX_GAS: ${MAX_GAS:-}
      MAX_FEE_PER_GAS_WEI: ${MAX_FEE_PER_GAS_WEI:-}
      MAX_PRIORITY_FEE_PER_GAS_WEI: ${MAX_PRIORITY_FEE_PER_GAS_WEI:-}
      ACTION_DEADLINE_SECONDS: ${ACTION_DEADLINE_SECONDS:-300}
    volumes:
      - ./deploy/manifests:/config/manifests:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', 'dist/health.js']
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s
    init: true
    restart: unless-stopped

  api:
    profiles: [app]
    image: ${IMAGE_PREFIX:-boundra}-api:${RELEASE:-dev}
    build:
      context: .
      target: api
      args:
        RELEASE: ${RELEASE:-dev}
    environment:
      <<: *chain
      NODE_ENV: production
      DATABASE_URL: *database-url
      API_HOST: 0.0.0.0
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Run pnpm env:setup first}
      # true only behind the public proxy, which sets X-Forwarded-For; otherwise it is spoofable.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      ADMIN_ADDRESSES: ${ADMIN_ADDRESSES:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_DEADLINE_MS: ${LLM_DEADLINE_MS:-20000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4000}
      LLM_MAX_TOKENS_PER_HOUR: ${LLM_MAX_TOKENS_PER_HOUR:-200000}
    volumes:
      - ./deploy/manifests:/config/manifests:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 6s
      retries: 3
    init: true
    restart: unless-stopped

  web:
    profiles: [app]
    image: ${IMAGE_PREFIX:-boundra}-web:${RELEASE:-dev}
    build:
      context: .
      target: web
      args:
        RELEASE: ${RELEASE:-dev}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 6s
      retries: 3
    init: true
    restart: unless-stopped

  # HTTPS in front of web and API on one origin (deploy/Caddyfile). Certificates come from
  # Let's Encrypt for a public APP_DOMAIN, or Caddy's local CA for APP_DOMAIN=localhost.
  proxy:
    profiles: [public]
    image: caddy:2.10.2-alpine
    environment:
      # Your public domain; localhost (the default) serves only this machine via Caddy's local CA.
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
